<section class="gsec" data-g="conn"><h2>Connection</h2>
<dl class="legend">
<dt>Avg ms</dt><dd><p>Average round-trip time to the opponent, measured by the game's own netcode (your inputs reach them in roughly half of that, plus the game's input delay).</p></dd>
<dt>Min / Max</dt><dd><p>Best and worst round trip in the match.</p></dd>
<dt>Jitter</dt><dd><p>How much the round trip swung (standard deviation); low means a steady connection.</p></dd>
<dt>Avg delay (f)</dt><dd><p>Online input delay in frames (1 f = 1/60 s = 16.7 ms): how long the netcode holds your button press before it happens on both screens.</p><details class="gmore"><summary>More</summary><p>The game adapts it during the match (about half the ping plus a safety margin, +1 after a stall), so it is the lag you actually feel. The list shows the match average; the match page adds min – max, p95 and how often it changed, and the timeline draws it as a step line, next to the opponent's own input delay (dashed orange, read from the headers of their packets; a break = not measured, e.g. right after a stall).</p><details class="tech"><summary>Technical details</summary><p>Filled in when the mod's delay measurement is on (<code>delay_scan = 1</code>, the default) and it could read the value in that match.</p></details></details></dd>
<dt>Stalls</dt><dd><p>Times the game froze waiting for the opponent's input (the seconds stalled in brackets).</p></dd>
<dt>Packet loss</dt><dd><p>The share of the opponent's packets that only arrived through a <b>resend</b>, because the first copy was lost or late on the way.</p><details class="gmore"><summary>More</summary><p>The game sends everything over Steam without delivery guarantees and resends missing packets itself; the mod reads the game's own counter of those (the same number that lowers the game's signal grade by a step at 5 %), so this is <i>about</i> packet loss, not an exact loss count. Only the opponent → you direction: your packets lost on the way to them show on their side. Match page: a tile (% · resent of packets · bursts) and pink ticks at the bottom of the ping chart, one per burst (taller = more packets; hover for the count). A resend costs about one round trip, so bursts often line up with stalls.</p><details class="tech"><summary>Technical details</summary><p>From v1.8.0 on (online matches).</p></details></details></dd>
<dt>Colour bands</dt><dd><p>The game's own signal grades: <span class="c1">&lt;66 ms green (Great)</span>, <span class="c2">66-133 yellow (Decent)</span>, <span class="c3">133-266 orange (Rough)</span>, <span class="c4">266-532 and &gt;532 ms red (Poor)</span>.</p><details class="gmore"><summary>More</summary><p>Rows are tinted with the grade of their average; the match page and the share picture name the grade (Signal).</p></details></dd>
<dt>Ping per match</dt><dd><p>The ping chart on an opponent page (Connection tab): your average ping in each match against that opponent, oldest to newest, on the grade colours, with a bar from the lowest to the highest ping of the match (hover a point for its date and ms).</p></dd>
</dl></section>
<section class="gsec" data-g="rank"><h2>Results and ranked points</h2>
<dl class="legend">
<dt>W/L</dt><dd><p>Result from your side: <b class="rw">W</b> win, <b class="rl">L</b> loss, <b class="rd">D</b> draw, <b class="ru">?</b> unknown (the match ended without a KO being seen, e.g. a disconnect, or it was recorded before v1.1.0).</p><details class="gmore"><summary>More</summary><p>Win rate counts wins and losses only; hover a result for how the match ended.</p></details></dd>
<dt>H2H</dt><dd><p>Your head-to-head record against that opponent after that match (W-L, or W-L-D with draws), shown from the second meeting on.</p><details class="gmore"><summary>More</summary><p>It is counted over all matches, whatever the filter.</p></details></dd>
<dt>Points</dt><dd><p>Ranked points won (<b class="rw">+N</b>) or lost (<b class="rl">-N</b>) in that match, from v1.7.0 on (older matches and matches where no change was seen: –).</p><details class="gmore"><summary>More</summary><p>"(unconfirmed)" = recorded before the source of the value was checked against the number the game showed.</p><details class="tech"><summary>Technical details</summary><p>The mod reads the game's own rank values before the match and after the result (read-only, <code>rank_lookup = 1</code>); hover for the rank and points before → after.</p></details></details></dd>
<dt>Rank</dt><dd><p>Matches page header: your current total points and rank for Singles and Team (the game's rank name, e.g. <i>Singles 30,326 · Z</i>), plus your current ranked win streak and your longest one (best), read after your newest recorded match; – until a match has recorded it.</p><details class="gmore"><summary>More</summary><p>The match page shows the points of that match under the result (hover: rank and points before → after and the win streak before → after).</p></details></dd>
<dt>Win streak</dt><dd><p>Yours: from the game's own ranked stats (header, and before → after on the match page).</p><details class="gmore"><summary>More</summary><details class="tech"><summary>Technical details</summary><p>The opponent's (<span class="osk">87W</span> next to their name, "their win streak" on the match page, a tile on the opponent page): read from the game's player card before the fight (v1.8.0, still being verified: the mod reads the player-info texts of the versus / result screen).</p></details></details></dd>
<dt>Special finish</dt><dd><p><span class="fin">★</span> next to the result: the match (or a Team round) ended with a <b>dramatic finish</b> of an ultimate (e.g. Master Roshi's Evil Containment Wave, Goku's Angry Kamehameha, Dragon Fist, Spirit Bomb; Giant = vs a giant), read from the game's own win type; the match page names the ultimate and who did it, the share picture says "dramatic finish".</p></dd>
<dt>DC</dt><dd><p>Next to the result: the fight ended without a KO / time up (someone quit or disconnected).</p><details class="gmore"><summary>More</summary><p>The result stays <b class="ru">?</b>; if the game still moved your ranked points, the Points column shows them and the match page says what the points imply (win / loss).</p></details></dd>
<dt>Streak, form</dt><dd><p>On the opponent pages: every result oldest to newest (click a square for the match), the current streak (unknown results are skipped) and the last 5 / 10 form.</p></dd>
</dl></section>
<section class="gsec" data-g="combat"><h2>Combat</h2>
<dl class="legend">
<dt>Match details</dt><dd><p>Side-by-side comparison You | Opponent (damage, attacks, combos, guard, counters &amp; wars, Sparking! ...).</p><details class="gmore"><summary>More</summary><p>The better value is highlighted (higher, or lower for guard breaks suffered and hits before a super counter); neutral rows are not.</p></details></dd>
<dt>Counters &amp; wars</dt><dd><p><b>Super counter</b> = the counter you start while being hit; <b>vanish</b> = the teleport dodge.</p><details class="gmore"><summary>More</summary><p>A <b>war</b> is 2 or more of them back and forth (at most 0.9 s apart): a <i>vanish war</i> (only vanishes), a <i>super counter war</i> (only super counters) or a <i>mixed war</i>. <b>Longest war</b> = most links in one war. <b>Clashes</b>: both sides dash into each other; the game decides the winner. Perception, revenge counters and high-speed evasions are counted per start.</p><details class="tech"><summary>Technical details</summary><p>From v1.6.0 on (older matches show – : their vanish counts mixed super counters and vanishes up). It is won by the side whose hit lands next within 1.5 s, else it is unresolved. <b>Super perception</b> (v1.8.0): the timed perception that catches a hit (the game reports the hit as super-perceived); <b>revenge counters caught by super perception</b> = the other side's revenge counter punished that way (the victim's row: <i>own revenge counters caught</i>).</p></details></details></dd>
<dt>Vanishing attacks &amp; assaults</dt><dd><p>Per side, with the game's own names.</p><details class="gmore"><summary>More</summary><p>A <b>vanishing attack</b> (Y / Triangle after knocking the opponent away; High / Low / Left / Right with the stick) is the teleport <i>chase</i> after a launch (smash, rush finisher, counter attack); a combo allows only a few of them. A <b>vanishing assault</b> (A + X / Cross + Square, costs ki) is the teleport attack from neutral, guard or a rush: behind the opponent up close, in front of them further away; from long range it only moves you in front of them, so it shows as <b>no contact</b>. <b>Started</b> counts every attempt, also the chained ones (the 2nd, 3rd chase in one combo); <b>landed</b> = its hit connected; otherwise the other side guarded it, countered it (super counter or revenge counter), vanished, evaded it with a high-speed evasion or perceived it, the attacker was <b>hit out of it</b> first, or it made <b>no contact</b>. <b>Chains</b> = combos with 2 or more. <b>Turned into a war</b> = the other side's vanish / super counter that stopped it opened a war; <b>won a war with it</b> = its hit decided a war. Damage = the HP the other side lost during it (Training shows none: its HP gauge does not move).</p><details class="tech"><summary>Technical details</summary><p>From v1.8.0 on. Hover a timeline marker for the outcome and the game's action id (<code>actVAA</code>… = vanishing attack, <code>actVAS</code>… = vanishing assault; the ini keys <code>vanishing_attack_actions</code> / <code>vanishing_assault_actions</code> set which ids count). Records before 1.9 show one number for both.</p></details></details></dd>
<dt>Healed</dt><dd><p>HP a character regained while it stayed on the field (regeneration, healing skills); HP changes in the 6 s after a switch or transformation are not counted.</p><details class="gmore"><summary>More</summary><p>Heals = separate healing moments (more than 1 s apart).</p><details class="tech"><summary>Technical details</summary><p>New in 1.9.1.</p></details></details></dd>
<dt>Damage done with</dt><dd><p>Damage per hit type, from the type of the hit the victim took at each HP drop: rush attacks, smashes (the knockback heavy hits), other melee, ki blasts, blast skills (supers), ultimates, impacts, other (throws, ...).</p><details class="gmore"><summary>More</summary><p>"Inside combos" = damage of hits landed while the attacker's combo counter was 2 or more, so a combo's first hit counts outside it. Share = per cent of all damage dealt.</p><details class="tech"><summary>Technical details</summary><p>New after 1.8.0 (older matches: no rows).</p></details></details></dd>
<dt>Wild Sense</dt><dd><p>Triggered = the Blast Forte activation (actEXA1 / actEXA2) of a character whose skill in that slot is Wild Sense (from the game's buff table).</p><details class="gmore"><summary>More</summary><p>Counter landed = while Wild Sense was armed, the character landed a melee-type hit without being in a rush, smash, throw or skill of its own (a provisional rule until the counter's own action id is calibrated); beaten = the armed character took a non-ki hit (a Perception counter, a grab).</p><details class="tech"><summary>Technical details</summary><p>New after 1.8.0.</p></details></details></dd>
<dt>Kicks, sweeps, chases</dt><dd><p><b>Flying kick</b> and <b>sweep</b> (Grand Slash, the low one) are rush chain attacks; <b>charged</b> = the sweep was held.</p><details class="gmore"><summary>More</summary><p><b>Blocked</b> = guarded. A <b>chase</b> is Dragon Homing, the dash after the opponent is knocked away (not the vanishing attack); <b>hit %</b> = chases that landed.</p><details class="tech"><summary>Technical details</summary><p>New after 1.8.0 (older matches: no rows).</p></details></details></dd>
<dt>Avg hits before SC</dt><dd><p>How many hits of the opponent's rush a player took (the countered hit included, blocked hits not) before super countering.</p><details class="gmore"><summary>More</summary><p>Counters inside vanish / super counter exchanges (e.g. against a follow-up rush right after a vanish) still count as super counters and in the wars, but not here: they are listed as <b>SC in exchanges</b> and marked "in exchange" on the timeline. <b>Lower is better</b> (an earlier counter). <b>Earliest</b> = the fewest in the match. On an opponent page: their and your average over all matches against each other.</p><details class="tech"><summary>Technical details</summary><p>From v1.7.3 on only super counters off a rush chain <b>from neutral</b> count: the rush started with no super counter, counter attack, vanish, vanishing attack / assault or revenge counter by either side (and no war / exchange ending) in the 1.5 s before it and none during it.</p></details></details></dd>
</dl></section>
<section class="gsec" data-g="ui"><h2>Pages and buttons</h2>
<dl class="legend">
<dt>Mode</dt><dd><p><span class="mode m1">Ranked</span>, <span class="mode">Quick</span> or <span class="mode">Player</span> (lobby) match; R / Q / P on a phone.</p></dd>
<dt>Incidents</dt><dd><p>Incident log (on by default; <code>debug_incidents = 0</code> in <code>BT4RankedDetails.ini</code> turns it off): an online match that ended abnormally or saw a network error gets a red <span class="dc">!</span> and a line on the Incidents page (error code shown by the game, battle phase, time since the start / the KO, HP of both sides, ping, stalls, points before → after, the last 20 s).</p></dd>
<dt>Characters</dt><dd><p>Your character(s) vs the opponent's (v1.2.0 on; hover for full names and DP).</p><details class="gmore"><summary>More</summary><p><b>Singles</b> / <b>DP</b> = the battle format; the Format filter applies to every list and to the totals.</p></details></dd>
<dt>Timeline</dt><dd><p>With <code>timeline = 1</code> (the default): HP of both sides (in Team battles every character is its own line, a dashed line marks the switch), event markers, stall bands, the ping (a white line; dark in the light theme) with the game's grade bands and a 2 s min/max envelope, your input delay (blue) and theirs (dashed orange), and your FPS against the opponent's.</p></dd>
<dt>Timeline chips</dt><dd><p>Click to show or hide a line; remembered in this browser (every match uses the same choice).</p><details class="gmore"><summary>More</summary><p><b>▾ HP</b> / <b>▾ Latency</b> folds the whole chart; the axes fit what is shown.</p></details></dd>
<dt>Pinned</dt><dd><p>The pin button on an opponent row (shown on hover) or on the opponent page keeps that opponent in the Pinned block at the top of Opponents (whatever the sort); pinned opponents get a small pin in the match list.</p><details class="gmore"><summary>More</summary><p>Pins are stored in this browser only (not in data.js), so another browser or a cleared browser storage starts without them.</p></details></dd>
<dt>Pages</dt><dd><p>Lists with more than 100 rows (matches, the matches vs one opponent, many opponents or teams) are split into pages of 100; "Showing 101–200 of 1,234" counts the rows of the current filter.</p></dd>
<dt>Reload</dt><dd><p>The page loads <code>data.js</code> once.</p><details class="gmore"><summary>More</summary><p>After a match, click <b>Reload</b> at the bottom of the page (or F5).</p></details></dd>
<dt>Share</dt><dd><p>Copies a square picture of the match to the clipboard (paste it into Discord); <b>Preview</b> shows it with a Download PNG button.</p></dd>
</dl></section>
</template>
<!-- "How to use it" (About page), cloned by Legend.svelte src="howto-src" -->
<template id="howto-src">
<ul>
<li>Open <code>ranked_details\history\index.html</code> in your browser (double-click). It works straight from the file and loads nothing from the internet.</li>
<li>The mod rewrites <code>data.js</code> at game start and after every real online match. The page reads it once when it opens: click <b>Reload</b> at the bottom of the page (or press F5) to see new matches; you stay on the same page.</li>
<li>Long lists show 100 rows per page (‹ Prev 1 2 3 … Next ›); filters, search and sort always work over all matches. The page number is in the link, so reload and back / forward keep it.</li>
<li><b>Matches</b>: filter by mode, format and opponent, click a column title to sort, click a row (or Open in the Full view column) to open the match page; the Steam column opens the opponent's Steam profile; ▾ in the Quick view column unfolds the match summary under its row (↑ / ↓ move it, Esc folds it); choose 10, 20 or 50 matches per page (remembered in this browser). A record of a fight that never happened (no result, a few seconds long) has a Delete button: it is hidden in this browser (Undo, or Restore all under the list); the data file keeps it. <b>Ended badly</b> lists the matches that ended abnormally. <b>Opponents</b>: one row per opponent (grouped by ID de cuenta, so renamed players stay together); pick the order in <i>Sort by</i>; an opponent's page has the same tabs as a match. <b>Characters</b>: a card per character and Team team; click one for its matches. <b>You</b>: your ranked points over time, the win rate per week and your habits.</li>
<li>Keyboard: <kbd>/</kbd> search an opponent, <kbd>←</kbd> / <kbd>→</kbd> older / newer match, <kbd>1</kbd>–<kbd>4</kbd> the match tabs, <kbd>Esc</kbd> back to the list, <kbd>?</kbd> all shortcuts. Every page has its own link (bookmark it, the browser's back button works).</li>
<li>Put your exact in-game name in <code>data\my_name.txt</code> if the opponent is ever picked wrong.</li>
<li>Timeline chips: click to show or hide a line; remembered in this browser (the same choice for every match; ▾ HP / ▾ Latency folds a whole chart).</li>
<li>Timeline: on by default (<code>timeline = 1</code> in <code>BT4RankedDetails.ini</code>); matches recorded while it was off have none.</li>
<li><code>refresh.bat</code> (optional, needs Python 3) rebuilds <code>data.js</code> from <code>..\data\matches.jsonl</code> and opens the page.</li>
</ul>
</template>

<template id="tips-src">
fpsg|Your 1-second average as your game sends it to the opponent: the same number, sampled the same way as theirs (on each change, about every 3 s)
fpso|Your 1-second average from your own frame times (this match has no number from your game). Waits for the opponent are not counted.
fpsr|Reported by the opponent’s game: its 1-second average, sent at most every 3 s, so single-frame hitches on their side never show
dsg| (your number as your game sends it, sampled like theirs)
dso| (your own 1-s windows: this match has no number from your game)
dst| (the number their game reports)
cu|A one-frame reading at the very end of the match (the netcode stopping at the KO, recorded by a pre-release build) is not counted as catch-up
drop|A drop = the 1-second average under {0} fps{1}; single slow frames are not counted. Time = how long it stayed under (under 55 / 50: {2} / {3} s); frames lost ≈ Σ (60 − fps) × time, an estimate. The opponent’s number (and yours as your game sends it) is updated about every 3 s, so short hitches are smoothed out. Stalls ({4}): {5} during their drops, {6} near yours, {7} with no drop on either side (probably the connection); a drop counts from 1 s before the report that showed it to 1 s after it
odl|The opponent's input delay (match average), from the headers of their packets
loss|Packets from the opponent that only arrived through a resend (the first copy was lost or late on the way), counted by the game's own netcode: about packet loss. Your packets lost on the way to them count on their side. The game's signal grade drops a step at 5 %.
</template>

<template id="tlfps-src"><p class="tl-note small"><b>Blue</b> = your FPS · <b>dashed orange</b> = opponent FPS (both as the game reports them, about every 3 s) · <b>red</b> = stall · <b>orange shading</b> = their drops · <b>purple</b> = catch-up · <b>dark ticks</b> = a load hitch: one long frame on your PC at a switch / transformation (not an FPS drop; the 1-s average hides it) · opponent waited on you (inferred): <svg class="lg ow" viewBox="-7 -7 14 14" aria-hidden="true"><path class="pc" d="M0,4.5L4.5,-3.6L-4.5,-3.6Z"/></svg> after a load hitch on your PC, <svg class="lg ow" viewBox="-7 -7 14 14" aria-hidden="true"><path d="M0,4.5L4.5,-3.6L-4.5,-3.6Z"/></svg> your inputs arrived late (network or their side) · chips: <b>Every second</b>, <b>Realtime</b></p></template>
<template id="odlnote-src"><p class="tl-note small">Their input delay reacts to how steadily your inputs reach them: a stable opponent delay often means your ping and FPS were steady; a rising one, that your inputs sometimes arrived late, most often right after one long frame on your PC while a character loaded.</p></template>
<template id="catchup-src"><details class="xpl"><summary>What is catch-up?</summary><ul>
<li>The game uses <b>lockstep</b>: both games advance frame by frame, and each needs the other's input for every frame. Your input is sent a few frames ahead: that is the input delay.</li>
<li>When inputs arrive too late (a PC dropped frames, or packets were delayed), the game missing them waits: a <b>stall</b>. Each stall makes the waiting game's delay window one frame bigger.</li>
<li>Once a delay window reaches about 21 frames (350 ms), the netcode switches both games to <b>catch-up mode</b>: your input is taken and sent only every 2nd frame (every 3rd from 40 frames, every 4th at 60) and repeated for the frames in between. Fewer packets, coarser input. It stays on until the match ends.</li>
<li>While your inputs are late, the opponent <b>likely</b> has to wait for them: a stall on their screen. "Opponent waited on you" is an estimate of that (a lower bound).</li>
<li>Catch-up in a match means the connection or a PC was very laggy at some point: check the FPS chart for drops on your side.</li>
<li>A stall while <b>their</b> FPS dips (dashed orange line) was probably their PC; stalls while both FPS lines stay near 60 were the connection.</li>
</ul></details></template>

<section class="gsec" data-g="conn"><h2>Conexión</h2>
<dl class="legend">
<dt>Media ms</dt><dd><p>Tiempo medio de ida y vuelta hasta el rival, medido por el propio netcode del juego (tus entradas le llegan en más o menos la mitad de eso, más el retraso de entrada del juego).</p></dd>
<dt>Mín / Máx</dt><dd><p>La mejor y la peor ida y vuelta de la partida.</p></dd>
<dt>Variación (jitter)</dt><dd><p>Cuánto osciló la ida y vuelta (desviación típica); bajo significa una conexión estable.</p></dd>
<dt>Retraso medio (f)</dt><dd><p>Retraso de entrada online en fotogramas (1 f = 1/60 s = 16.7 ms): cuánto retiene el netcode tu pulsación antes de que ocurra en ambas pantallas.</p><details class="gmore"><summary>Más</summary><p>El juego lo ajusta durante la partida (más o menos la mitad del ping más un margen de seguridad, +1 tras un parón), así que es el lag que notas de verdad. La lista muestra la media de la partida; la página de la partida añade mín – máx, p95 y cuántas veces cambió, y la línea de tiempo lo dibuja como una línea escalonada, junto al retraso de entrada del propio rival (naranja discontinuo, leído de las cabeceras de sus paquetes; un corte = sin medir, p. ej. justo después de un parón).</p><details class="tech"><summary>Detalles técnicos</summary><p>Se rellena cuando la medición de retraso del mod está activa (<code>delay_scan = 1</code>, por defecto) y pudo leer el valor en esa partida.</p></details></details></dd>
<dt>Parones</dt><dd><p>Veces que el juego se congeló esperando la entrada del rival (los segundos de parón, entre paréntesis).</p></dd>
<dt>Pérdida de paquetes</dt><dd><p>La proporción de paquetes del rival que solo llegaron mediante un <b>reenvío</b>, porque la primera copia se perdió o llegó tarde por el camino.</p><details class="gmore"><summary>Más</summary><p>El juego lo envía todo por Steam sin garantía de entrega y reenvía él mismo los paquetes que faltan; el mod lee el propio contador del juego de esos reenvíos (el mismo número que baja un escalón la calidad de señal del juego al 5 %), así que esto es <i>aproximadamente</i> la pérdida de paquetes, no un recuento exacto. Solo la dirección rival → tú: tus paquetes perdidos de camino a él se ven en su lado. Página de la partida: una ficha (% · reenviados de los paquetes · ráfagas) y marcas rosas al pie del gráfico de ping, una por ráfaga (más alta = más paquetes; pasa el ratón para ver el recuento). Un reenvío cuesta más o menos una ida y vuelta, así que las ráfagas suelen coincidir con parones.</p><details class="tech"><summary>Detalles técnicos</summary><p>Desde la v1.8.0 (partidas online).</p></details></details></dd>
<dt>Bandas de color</dt><dd><p>Las calidades de señal del propio juego: <span class="c1">&lt;66 ms verde (Buena)</span>, <span class="c2">66-133 amarillo (Regular)</span>, <span class="c3">133-266 naranja (Mala)</span>, <span class="c4">266-532 y &gt;532 ms rojo (Muy mala)</span>.</p><details class="gmore"><summary>Más</summary><p>Las filas se tiñen con la calidad de su media; la página de la partida y la imagen para compartir nombran la calidad (Señal).</p></details></dd>
<dt>Ping por partida</dt><dd><p>El gráfico de ping de la página de un rival (pestaña Conexión): tu ping medio en cada partida contra ese rival, de la más antigua a la más reciente, sobre los colores de calidad, con una barra del ping más bajo al más alto de la partida (pasa el ratón por un punto para ver su fecha y los ms).</p></dd>
</dl></section>
<section class="gsec" data-g="rank"><h2>Resultados y puntos de ranked</h2>
<dl class="legend">
<dt>V/D</dt><dd><p>Resultado desde tu lado: <b class="rw">V</b> victoria, <b class="rl">D</b> derrota, <b class="rd">E</b> empate, <b class="ru">?</b> desconocido (la partida terminó sin que se viera un KO, p. ej. por una desconexión, o se registró antes de la v1.1.0).</p><details class="gmore"><summary>Más</summary><p>El porcentaje de victorias solo cuenta victorias y derrotas; pasa el ratón por un resultado para ver cómo terminó la partida.</p></details></dd>
<dt>H2H</dt><dd><p>Tu historial cara a cara contra ese rival tras esa partida (V-D, o V-D-E con empates), mostrado a partir del segundo enfrentamiento.</p><details class="gmore"><summary>Más</summary><p>Se cuenta sobre todas las partidas, sea cual sea el filtro.</p></details></dd>
<dt>Puntos</dt><dd><p>Puntos de Ranked ganados (<b class="rw">+N</b>) o perdidos (<b class="rl">-N</b>) en esa partida, desde la v1.7.0 (partidas antiguas y partidas en las que no se vio ningún cambio: –).</p><details class="gmore"><summary>Más</summary><p>"(sin confirmar)" = registrado antes de comprobar el origen del valor con el número que mostraba el juego.</p><details class="tech"><summary>Detalles técnicos</summary><p>El mod lee los propios valores de rango del juego antes de la partida y después del resultado (solo lectura, <code>rank_lookup = 1</code>); pasa el ratón para ver el rango y los puntos antes → después.</p></details></details></dd>
<dt>Rango</dt><dd><p>Cabecera de la página de partidas: tus puntos totales y tu rango actuales en Individual (Singles) y (el nombre de rango del juego, p. ej. <i>Individual 30,326 · Z</i>), más tu racha de victorias actual en Ranked y la más larga (mejor), leídas tras tu partida registrada más reciente; – hasta que una partida lo haya registrado.</p><details class="gmore"><summary>Más</summary><p>La página de la partida muestra los puntos de esa partida bajo el resultado (al pasar el ratón: rango y puntos antes → después y la racha de victorias antes → después).</p></details></dd>
<dt>Racha de victorias</dt><dd><p>La tuya: de las propias estadísticas de Ranked del juego (cabecera, y antes → después en la página de la partida).</p><details class="gmore"><summary>Más</summary><details class="tech"><summary>Detalles técnicos</summary><p>La del rival (<span class="osk">87V</span> junto a su nombre, "su racha de victorias" en la página de la partida, una ficha en la página del rival): leída de la tarjeta de jugador del juego antes del combate (v1.8.0, aún en verificación: el mod lee los textos de información del jugador de la pantalla de enfrentamiento / resultado).</p></details></details></dd>
<dt>Final especial</dt><dd><p><span class="fin">★</span> junto al resultado: la partida (o una ronda de) terminó con un <b>final dramático</b> de un ultimate (p. ej. Evil Containment Wave de Master Roshi, Angry Kamehameha de Goku, Dragon Fist, Spirit Bomb; Gigante = contra un gigante), leído del propio tipo de victoria del juego; la página de la partida nombra el ultimate y quién lo hizo, y la imagen para compartir dice "final dramático".</p></dd>
<dt>DC</dt><dd><p>Junto al resultado: el combate terminó sin KO / tiempo agotado (alguien abandonó o se desconectó).</p><details class="gmore"><summary>Más</summary><p>El resultado se queda en <b class="ru">?</b>; si el juego aun así movió tus puntos de Ranked, la columna Puntos los muestra y la página de la partida dice qué implican esos puntos (victoria / derrota).</p></details></dd>
<dt>Racha, forma</dt><dd><p>En las páginas de rivales: cada resultado del más antiguo al más reciente (haz clic en un cuadro para ir a la partida), la racha actual (los resultados desconocidos se omiten) y la forma en las últimas 5 / 10.</p></dd>
</dl></section>
<section class="gsec" data-g="combat"><h2>Combate</h2>
<dl class="legend">
<dt>Detalles de la partida</dt><dd><p>Comparación lado a lado Tú | Rival (daño, ataques, combos, guardia, counters &amp; guerras, Sparking! ...).</p><details class="gmore"><summary>Más</summary><p>Se resalta el mejor valor (el más alto, o el más bajo en roturas de guardia sufridas y golpes antes de un super counter); las filas neutras no.</p></details></dd>
<dt>Counters &amp; guerras</dt><dd><p><b>Super counter</b> = el counter que inicias mientras te golpean; <b>vanish</b> = la esquiva con teletransporte.</p><details class="gmore"><summary>Más</summary><p>Una <b>guerra</b> son 2 o más de ellos de ida y vuelta (como mucho a 0.9 s entre sí): una <i>guerra de vanish</i> (vanish war; solo vanishes), una <i>guerra de super counter</i> (super counter war; solo super counters) o una <i>guerra mixta</i>. <b>Guerra más larga</b> = más eslabones en una guerra. <b>Choques</b>: ambos lados se lanzan el uno contra el otro; el juego decide el ganador. Las percepciones, los revenge counters y las evasiones a alta velocidad se cuentan por inicio.</p><details class="tech"><summary>Detalles técnicos</summary><p>Desde la v1.6.0 (las partidas antiguas muestran – : sus recuentos de vanish mezclaban super counters y vanishes). La gana el lado cuyo golpe conecta a continuación en 1.5 s; si no, queda sin resolver. <b>Superpercepción</b> (v1.8.0): la percepción a tiempo que atrapa un golpe (el juego informa del golpe como superpercibido); <b>revenge counters atrapados por superpercepción</b> = el revenge counter del otro lado castigado así (la fila de la víctima: <i>revenge counters propios atrapados</i>).</p></details></details></dd>
<dt>Vanishing attacks &amp; assaults</dt><dd><p>Por lado, con los nombres propios del juego.</p><details class="gmore"><summary>Más</summary><p>Un <b>vanishing attack</b> (Y / Triángulo tras mandar lejos al rival; Arriba / Abajo / Izquierda / Derecha con el stick) es la <i>persecución</i> con teletransporte tras un lanzamiento (smash, remate de rush, contraataque); un combo solo permite unos pocos. Un <b>vanishing assault</b> (A + X / Cruz + Cuadrado, cuesta ki) es el ataque con teletransporte desde neutral, la guardia o un rush: detrás del rival si está cerca, delante de él si está más lejos; a larga distancia solo te coloca delante de él, así que aparece como <b>sin contacto</b>. <b>Iniciados</b> cuenta cada intento, también los encadenados (la 2.ª, 3.ª persecución en un combo); <b>conectados</b> = su golpe conectó; si no, el otro lado lo bloqueó, lo contrarrestó (super counter o revenge counter), hizo vanish, lo esquivó con una evasión a alta velocidad o lo percibió, el atacante fue <b>interrumpido por un golpe</b> antes, o quedó <b>sin contacto</b>. <b>Cadenas</b> = combos con 2 o más. <b>Acabó en guerra</b> = el vanish / super counter del otro lado que lo detuvo abrió una guerra; <b>ganó una guerra con él</b> = su golpe decidió una guerra. Daño = la vida que perdió el otro lado durante él (Entrenamiento no muestra nada: allí la barra de vida no se mueve).</p><details class="tech"><summary>Detalles técnicos</summary><p>Desde la v1.8.0. Pasa el ratón por un marcador de la línea de tiempo para ver el resultado y el id de acción del juego (<code>actVAA</code>… = vanishing attack, <code>actVAS</code>… = vanishing assault; las claves del ini <code>vanishing_attack_actions</code> / <code>vanishing_assault_actions</code> fijan qué ids cuentan). Los registros anteriores a 1.9 muestran un solo número para ambos.</p></details></details></dd>
<dt>Vida recuperada</dt><dd><p>Vida que recuperó un personaje mientras seguía en el campo (regeneración, habilidades de curación); los cambios de vida en los 6 s posteriores a un cambio o una transformación no se cuentan.</p><details class="gmore"><summary>Más</summary><p>Curaciones = momentos de curación separados (con más de 1 s entre sí).</p><details class="tech"><summary>Detalles técnicos</summary><p>Nuevo en 1.9.1.</p></details></details></dd>
<dt>Daño hecho con</dt><dd><p>Daño por tipo de golpe, según el tipo del golpe que recibió la víctima en cada bajada de vida: rush attacks, smashes (los golpes fuertes que mandan lejos), otros cuerpo a cuerpo, ki blasts, blast skills (supers), ultimates, impactos, otros (agarres, ...).</p><details class="gmore"><summary>Más</summary><p>"Dentro de combos" = daño de los golpes conectados mientras el contador de combo del atacante era 2 o más, así que el primer golpe de un combo cuenta fuera. Porcentaje = tanto por ciento de todo el daño infligido.</p><details class="tech"><summary>Detalles técnicos</summary><p>Nuevo después de 1.8.0 (partidas antiguas: sin filas).</p></details></details></dd>
<dt>Wild Sense</dt><dd><p>Activado = la activación de Blast Forte (actEXA1 / actEXA2) de un personaje cuya habilidad en esa ranura es Wild Sense (según la tabla de mejoras del juego).</p><details class="gmore"><summary>Más</summary><p>Counter conectado = mientras Wild Sense estaba armado, el personaje conectó un golpe de tipo cuerpo a cuerpo sin estar en un rush, smash, agarre o habilidad propia (una regla provisional hasta calibrar el id de acción propio del counter); superado = el personaje armado recibió un golpe que no era de ki (un counter de Percepción, un agarre).</p><details class="tech"><summary>Detalles técnicos</summary><p>Nuevo después de 1.8.0.</p></details></details></dd>
<dt>Patadas, barridos, persecuciones</dt><dd><p>La <b>patada voladora</b> y el <b>barrido</b> (Grand Slash, el bajo) son ataques de la rush chain; <b>cargado</b> = el barrido se mantuvo pulsado.</p><details class="gmore"><summary>Más</summary><p><b>Bloqueado</b> = con guardia. Una <b>persecución</b> es el Dragon Homing, el dash tras mandar lejos al rival (no el vanishing attack); <b>% de acierto</b> = persecuciones que conectaron.</p><details class="tech"><summary>Detalles técnicos</summary><p>Nuevo después de 1.8.0 (partidas antiguas: sin filas).</p></details></details></dd>
<dt>Golpes medios antes de SC</dt><dd><p>Cuántos golpes del rush del rival recibió un jugador (incluido el golpe contrarrestado, sin contar los bloqueados) antes de hacer super counter.</p><details class="gmore"><summary>Más</summary><p>Los counters dentro de intercambios de vanish / super counter (p. ej. contra un rush de seguimiento justo después de un vanish) siguen contando como super counters y en las guerras, pero no aquí: aparecen como <b>SC en intercambios</b> y marcados como "en intercambio" en la línea de tiempo. <b>Menos es mejor</b> (un counter más temprano). <b>Más temprano</b> = el mínimo de la partida. En la página de un rival: su media y la tuya en todas las partidas entre vosotros.</p><details class="tech"><summary>Detalles técnicos</summary><p>Desde la v1.7.3 solo cuentan los super counters contra una rush chain <b>desde neutral</b>: el rush empezó sin super counter, contraataque, vanish, vanishing attack / assault ni revenge counter de ningún lado (y sin final de guerra / intercambio) en los 1.5 s anteriores ni durante él.</p></details></details></dd>
</dl></section>
<section class="gsec" data-g="ui"><h2>Pantallas y botones</h2>
<dl class="legend">
<dt>Modo</dt><dd><p>Partida <span class="mode m1">Ranked</span>, <span class="mode">Rápida</span> o <span class="mode">Jugador</span> (sala); R / Rá / J en el móvil.</p></dd>
<dt>Incidencias</dt><dd><p>Registro de incidencias (activo por defecto; <code>debug_incidents = 0</code> en <code>BT4RankedDetails.ini</code> lo desactiva): una partida online que terminó de forma anómala o tuvo un error de red recibe un <span class="dc">!</span> rojo y una línea en la página de Incidencias (código de error mostrado por el juego, fase del combate, tiempo desde el inicio / el KO, vida de ambos lados, ping, parones, puntos antes → después, los últimos 20 s).</p></dd>
<dt>Personajes</dt><dd><p>Tu(s) personaje(s) contra los del rival (desde la v1.2.0; pasa el ratón para ver los nombres completos y).</p><details class="gmore"><summary>Más</summary><p><b>Individual</b> / <b>PD</b> = el formato de combate; el filtro Formato se aplica a todas las listas y a los totales.</p></details></dd>
<dt>Línea de tiempo</dt><dd><p>Con <code>timeline = 1</code> (por defecto): vida de ambos lados (en batallas cada personaje es su propia línea; una línea discontinua marca el cambio), marcadores de eventos, bandas de parón, el ping (una línea blanca; oscura en el tema claro) con las bandas de calidad del juego y una envolvente mín/máx de 2 s, tu retraso de entrada (azul) y el suyo (naranja discontinuo), y tus FPS frente a los del rival.</p></dd>
<dt>Botones de la línea de tiempo</dt><dd><p>Haz clic para mostrar u ocultar una línea; se recuerda en este navegador (todas las partidas usan la misma elección).</p><details class="gmore"><summary>Más</summary><p><b>▾ Vida</b> / <b>▾ Latencia</b> pliega el gráfico entero; los ejes se ajustan a lo que se muestra.</p></details></dd>
<dt>Fijado</dt><dd><p>El botón de fijar de la fila de un rival (aparece al pasar el ratón) o de su página mantiene a ese rival en el bloque Fijados, arriba del todo en Rivales (sea cual sea el orden); los rivales fijados llevan una pequeña chincheta en la lista de partidas.</p><details class="gmore"><summary>Más</summary><p>Los fijados se guardan solo en este navegador (no en data.js), así que otro navegador o un almacenamiento del navegador borrado empieza sin ellos.</p></details></dd>
<dt>Páginas</dt><dd><p>Las listas con más de 100 filas (partidas, las partidas contra un rival, muchos rivales o equipos) se dividen en páginas de 100; "Mostrando 101–200 de 1,234" cuenta las filas del filtro actual.</p></dd>
<dt>Recargar</dt><dd><p>La página carga <code>data.js</code> una vez.</p><details class="gmore"><summary>Más</summary><p>Tras una partida, haz clic en <b>Recargar</b> al pie de la página (o pulsa F5).</p></details></dd>
<dt>Compartir</dt><dd><p>Copia una imagen cuadrada de la partida al portapapeles (pégala en Discord); <b>Vista previa</b> la muestra con un botón Descargar PNG.</p></dd>
</dl></section>
</template>
<template id="howto-src-es">
<ul>
<li>Abre <code>ranked_details\history\index.html</code> en tu navegador (doble clic). Funciona directamente desde el archivo y no carga nada de internet.</li>
<li>El mod reescribe <code>data.js</code> al iniciar el juego y después de cada partida online real. La página lo lee una vez al abrirse: haz clic en <b>Recargar</b> al pie de la página (o pulsa F5) para ver las partidas nuevas; te quedas en la misma página.</li>
<li>Las listas largas muestran 100 filas por página (‹ Anterior 1 2 3 … Siguiente ›); los filtros, la búsqueda y el orden siempre se aplican a todas las partidas. El número de página va en el enlace, así que recargar y atrás / adelante lo conservan.</li>
<li><b>Partidas</b>: filtra por modo, formato y rival, haz clic en el título de una columna para ordenar y en una fila (o en Abrir, en la columna Vista completa) para abrir la página de la partida; la columna Steam abre el perfil de Steam del rival; ▾ en la columna Vista rápida despliega el resumen de la partida debajo de su fila (↑ / ↓ la mueven, Esc la pliega); elige 10, 20 o 50 partidas por página (se recuerda en este navegador). Un registro de una pelea que nunca existió (sin resultado, de pocos segundos) tiene un botón Borrar: se oculta en este navegador (Deshacer, o Restaurar todos debajo de la lista); el archivo de datos lo conserva. <b>Terminadas mal</b> reúne las partidas que acabaron de forma anómala. <b>Rivales</b>: una fila por rival (agrupados por ID de cuenta, así que los jugadores que cambian de nombre siguen juntos); elige el orden en <i>Ordenar por</i>; la página de un rival tiene pestañas como una partida. <b>Personajes</b>: una tarjeta por personaje y equipo; haz clic en una para ver sus partidas. <b>Tú</b>: tus puntos de ranked en el tiempo, el % de victorias por semana y tus costumbres.</li>
<li>Teclado: <kbd>/</kbd> busca un rival, <kbd>←</kbd> / <kbd>→</kbd> partida anterior / siguiente, <kbd>1</kbd>–<kbd>4</kbd> las pestañas de la partida, <kbd>Esc</kbd> vuelve a la lista, <kbd>?</kbd> todos los atajos. Cada página tiene su propio enlace (guárdalo en marcadores; el botón atrás del navegador funciona).</li>
<li>Pon tu nombre exacto del juego en <code>data\my_name.txt</code> si alguna vez se elige mal al rival.</li>
<li>Botones de la línea de tiempo: haz clic para mostrar u ocultar una línea; se recuerda en este navegador (la misma elección para todas las partidas; ▾ Vida / ▾ Latencia pliega un gráfico entero).</li>
<li>Línea de tiempo: activa por defecto (<code>timeline = 1</code> en <code>BT4RankedDetails.ini</code>); las partidas registradas mientras estaba desactivada no tienen.</li>
<li><code>refresh.bat</code> (opcional, necesita Python 3) reconstruye <code>data.js</code> a partir de <code>..\data\matches.jsonl</code> y abre la página.</li>
</ul>
</template>
<template id="tips-src-es">
fpsg|Tu media de 1 segundo tal como tu juego la envía al rival: el mismo número, muestreado igual que el suyo (en cada cambio, más o menos cada 3 s)
fpso|Tu media de 1 segundo a partir de tus propios tiempos de fotograma (esta partida no tiene número de tu juego). No se cuentan las esperas al rival.
fpsr|Lo informa el juego del rival: su media de 1 segundo, enviada como mucho cada 3 s, así que los tirones de un solo fotograma en su lado nunca aparecen
dsg| (tu número tal como lo envía tu juego, muestreado como el suyo)
dso| (tus propias ventanas de 1 s: esta partida no tiene número de tu juego)
dst| (el número que informa su juego)
cu|Una lectura de un solo fotograma justo al final de la partida (el netcode deteniéndose en el KO, registrada por una versión previa) no se cuenta como recuperación
drop|Una caída = la media de 1 segundo por debajo de {0} fps{1}; los fotogramas lentos sueltos no se cuentan. Tiempo = cuánto estuvo por debajo (por debajo de 55 / 50: {2} / {3} s); fotogramas perdidos ≈ Σ (60 − fps) × tiempo, una estimación. El número del rival (y el tuyo tal como lo envía tu juego) se actualiza más o menos cada 3 s, así que los tirones cortos se suavizan. Parones ({4}): {5} durante sus caídas, {6} cerca de las tuyas, {7} sin caída en ningún lado (probablemente la conexión); una caída cuenta desde 1 s antes del informe que la mostró hasta 1 s después
odl|El retraso de entrada del rival (media de la partida), de las cabeceras de sus paquetes

<template id="tlfps-src-es"><p class="tl-note small"><b>Azul</b> = tus FPS · <b>naranja discontinuo</b> = FPS del rival (ambos tal como los informa el juego, más o menos cada 3 s) · <b>rojo</b> = parón · <b>sombreado naranja</b> = sus caídas · <b>morado</b> = recuperación · <b>marcas oscuras</b> = un tirón de carga: un fotograma largo en tu PC en un cambio / transformación (no es una caída de FPS; la media de 1 s lo oculta) · el rival te esperó (estimado): <svg class="lg ow" viewBox="-7 -7 14 14" aria-hidden="true"><path class="pc" d="M0,4.5L4.5,-3.6L-4.5,-3.6Z"/></svg> tras un tirón de carga en tu PC, <svg class="lg ow" viewBox="-7 -7 14 14" aria-hidden="true"><path d="M0,4.5L4.5,-3.6L-4.5,-3.6Z"/></svg> tus entradas llegaron tarde (la red o su lado) · botones: <b>Cada segundo</b>, <b>Tiempo real</b></p></template>
<template id="odlnote-src-es"><p class="tl-note small">Su retraso de entrada reacciona a lo regular que le llegan tus entradas: un retraso del rival estable suele significar que tu ping y tus FPS fueron estables; uno que sube, que tus entradas a veces llegaron tarde, casi siempre justo después de un fotograma largo en tu PC mientras cargaba un personaje.</p></template>
<template id="catchup-src-es"><details class="xpl"><summary>¿Qué es la recuperación?</summary><ul>
<li>El juego usa <b>lockstep</b>: ambos juegos avanzan fotograma a fotograma, y cada uno necesita la entrada del otro para cada fotograma. Tu entrada se envía unos fotogramas por adelantado: ese es el retraso de entrada.</li>
<li>Cuando las entradas llegan demasiado tarde (un PC perdió fotogramas o los paquetes se retrasaron), el juego al que le faltan espera: un <b>parón</b>. Cada parón agranda en un fotograma la ventana de retraso del juego que espera.</li>
<li>Cuando una ventana de retraso llega a unos 21 fotogramas (350 ms), el netcode pasa ambos juegos al <b>modo de recuperación</b>: tu entrada se toma y se envía solo cada 2 fotogramas (cada 3 a partir de 40 fotogramas, cada 4 a partir de 60) y se repite en los fotogramas intermedios. Menos paquetes, entrada más tosca. Sigue activo hasta que termina la partida.</li>
<li>Mientras tus entradas llegan tarde, es <b>probable</b> que el rival tenga que esperarlas: un parón en su pantalla. "El rival te esperó" es una estimación de eso (un límite inferior).</li>
<li>Que haya recuperación en una partida significa que la conexión o un PC tuvo mucho lag en algún momento: mira en el gráfico de FPS si hubo caídas en tu lado.</li>
<li>Un parón mientras <b>sus</b> FPS bajan (línea naranja discontinua) probablemente fue culpa de su PC; los parones mientras ambas líneas de FPS se mantienen cerca de 60 fueron la conexión.</li>
</ul></details></template>
