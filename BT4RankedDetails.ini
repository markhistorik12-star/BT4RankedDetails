; BT4 Ranked Details configuration (auto-reloaded every ~1 s while the game runs)

[Display]
; 1 = show the in-game overlay, 0 = hide it (records are still written)
display = 1
; 0 = show only during online sessions (default). 1 = always show (useful to test position offline)
show_always = 0
; Distance in pixels from the bottom-right corner of the BT4decomp window
offset_x = 24
offset_y = 24
; Font sizes (px)
font_main = 34
font_small = 14
; 1 = translucent dark rounded panel, 0 = plain text
panel = 1
panel_opacity = 78
panel_radius = 10
panel_min_width = 210
; 1 = show input delay & game speed line, 0 = hide
show_delay = 1
; 1 = show rollbacks/s & waits line, 0 = hide
show_rollback = 1
; 1 = show delay swing bar on top of the panel, 0 = hide
swing = 1

[Records]
history_js = history\data.js
rank_lookup = 1
combat_tracking = 1
timeline = 1
fps_tracking = 1
offline_log = 0

[Advanced]
hook_winhttp = 1
aob_scan = 1

[Debug]
debug_incidents = 1
verbose_log = 0
